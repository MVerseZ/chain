<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌤️ Погодный Агент</title>
    <!-- marked.js — лёгкий парсер Markdown в браузере -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .app {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 40px);
        }

        header {
            color: white;
            text-align: center;
            margin-bottom: 16px;
        }
        header h1 {
            margin: 0 0 4px;
            font-size: 26px;
            font-weight: 700;
        }
        header p {
            margin: 0;
            opacity: 0.85;
            font-size: 14px;
        }

        #chat-container {
            flex: 1;
            background: white;
            border-radius: 16px;
            padding: 20px;
            overflow-y: auto;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        #chat-container::-webkit-scrollbar { width: 8px; }
        #chat-container::-webkit-scrollbar-thumb {
            background: #ccc; border-radius: 4px;
        }

        .message {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: fadeIn 0.2s ease-in;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-self: flex-end;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            align-self: flex-start;
            background: #f4f5f8;
            color: #1a1a2e;
            border-bottom-left-radius: 4px;
            border: 1px solid #e5e7eb;
        }

        /* --- Стили для Markdown внутри ответа ассистента --- */
        .message.assistant h1,
        .message.assistant h2,
        .message.assistant h3 {
            margin: 8px 0 6px;
            line-height: 1.3;
        }
        .message.assistant h1 { font-size: 18px; }
        .message.assistant h2 { font-size: 16px; }
        .message.assistant h3 { font-size: 15px; }

        .message.assistant p {
            margin: 6px 0;
        }
        .message.assistant ul,
        .message.assistant ol {
            margin: 6px 0;
            padding-left: 22px;
        }
        .message.assistant li { margin: 2px 0; }
        .message.assistant strong { color: #0f172a; }
        .message.assistant code {
            background: #e5e7eb;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 13px;
        }
        .message.assistant pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 10px 12px;
            border-radius: 8px;
            overflow-x: auto;
            font-size: 13px;
        }
        .message.assistant pre code {
            background: transparent;
            padding: 0;
            color: inherit;
        }
        .message.assistant blockquote {
            margin: 6px 0;
            padding-left: 10px;
            border-left: 3px solid #cbd5e1;
            color: #64748b;
        }
        .message.assistant hr {
            border: none;
            border-top: 1px solid #e5e7eb;
            margin: 10px 0;
        }
        .message.assistant a { color: #1a73e8; }

        /* --- Индикатор "печатает" --- */
        .typing {
            display: inline-flex;
            gap: 4px;
            align-items: center;
            padding: 4px 0;
        }
        .typing span {
            width: 6px; height: 6px;
            background: #94a3b8;
            border-radius: 50%;
            animation: blink 1.2s infinite ease-in-out;
        }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink {
            0%, 80%, 100% { opacity: 0.3; transform: scale(0.85); }
            40% { opacity: 1; transform: scale(1); }
        }

        /* --- Поле ввода --- */
        .input-area {
            display: flex;
            gap: 10px;
            background: white;
            padding: 8px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        #question {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: #f4f5f8;
        }
        #question:focus { background: #eef0f5; }
        #send-btn {
            padding: 12px 22px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: transform 0.1s, opacity 0.2s;
        }
        #send-btn:hover:not(:disabled) { transform: scale(1.03); }
        #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="app">
        <header>
            <h1>🌤️ Погодный Агент</h1>
            <p>Спросите о погоде в любом городе</p>
        </header>

        <div id="chat-container"></div>

        <div class="input-area">
            <input type="text" id="question" placeholder="Например: какая погода в Москве?" autocomplete="off">
            <button id="send-btn" onclick="sendQuestion()">Отправить</button>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const questionInput = document.getElementById('question');
        const sendBtn = document.getElementById('send-btn');
        let currentEventSource = null;

        // Настройка marked: не экранируем HTML, поддерживаем переносы
        marked.setOptions({ breaks: true, gfm: true });

        function addMessage(role, html = '') {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            if (role === 'assistant') {
                div.innerHTML = `<div class="md"></div>`;
                div.querySelector('.md').innerHTML = html;
            } else {
                div.textContent = html; // для пользователя — текст как есть
            }
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return div.querySelector('.md') || div;
        }

        function renderMarkdown(target, rawText) {
            // Рендерим Markdown в HTML через marked
            target.innerHTML = marked.parse(rawText);
        }

        function sendQuestion() {
            const question = questionInput.value.trim();
            if (!question) return;

            questionInput.value = '';
            questionInput.disabled = true;
            sendBtn.disabled = true;

            // Сообщение пользователя — как текст
            addMessage('user', question);

            // Пузырь ассистента с индикатором "печатает"
            const bubble = document.createElement('div');
            bubble.className = 'message assistant';
            bubble.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
            chatContainer.appendChild(bubble);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            if (currentEventSource) currentEventSource.close();

            const url = `/chat/stream?question=${encodeURIComponent(question)}&thread_id=web-user`;
            currentEventSource = new EventSource(url);

            let rawAnswer = '';
            let firstToken = true;

            currentEventSource.addEventListener('message', (event) => {
                const data = JSON.parse(event.data);
                if (!data.token) return;

                if (firstToken) {
                    firstToken = false;
                    bubble.innerHTML = `<div class="md"></div>`;
                }

                rawAnswer += data.token;
                // Рендерим Markdown на каждом токене (небольшие ответы — ок по производительности)
                renderMarkdown(bubble.querySelector('.md'), rawAnswer);
                chatContainer.scrollTop = chatContainer.scrollHeight;
            });

            currentEventSource.addEventListener('done', (event) => {
                const data = JSON.parse(event.data);

                // Если бэкенд прислал финальный (исправленный) ответ — заменяем
                if (data.final_answer && data.final_answer !== rawAnswer) {
                    rawAnswer = data.final_answer;
                    bubble.innerHTML = `<div class="md"></div>`;
                    renderMarkdown(bubble.querySelector('.md'), rawAnswer);
                } else if (firstToken) {
                    // Пустой ответ — показать заглушку
                    bubble.innerHTML = `<em>Пустой ответ</em>`;
                }

                chatContainer.scrollTop = chatContainer.scrollHeight;
                currentEventSource.close();
                currentEventSource = null;
                questionInput.disabled = false;
                sendBtn.disabled = false;
                questionInput.focus();
            });

            currentEventSource.addEventListener('error', (event) => {
                let msg = 'Неизвестная ошибка';
                try {
                    const data = JSON.parse(event.data);
                    msg = data.error || msg;
                } catch (e) {}
                bubble.innerHTML = `<div style="color:#dc2626">❌ ${msg}</div>`;
                currentEventSource.close();
                currentEventSource = null;
                questionInput.disabled = false;
                sendBtn.disabled = false;
            });
        }

        questionInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendQuestion();
        });

        questionInput.focus();
    </script>
</body>
</html>
